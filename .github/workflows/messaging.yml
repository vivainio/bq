name: Messaging integration

on:
  push:
    branches: [master]
    paths:
      - 'Bq.Messaging/**'
      - 'Bq.Messaging.Tests/**'
      - 'Bq.Testing/**'
      - 'Bq.Persistence.Sqlite/**'
      - 'Bq.Persistence.Oracle/**'
      - 'Bq.Extensions.CastleWindsor/**'
      - 'Bq.Reference.Windsor/**'
      - 'Bq.Reference.Net10/**'
      - 'Bq.Messaging.Tests.TUnit/**'
      - 'Bq.Persistence.Oracle.Ef6Check/**'
      - 'scripts/test-rabbitmq.sh'
      - 'scripts/test-rabbit-sim.sh'
      - '.github/workflows/messaging.yml'
  pull_request:
    paths:
      - 'Bq.Messaging/**'
      - 'Bq.Messaging.Tests/**'
      - 'Bq.Testing/**'
      - 'Bq.Persistence.Sqlite/**'
      - 'Bq.Persistence.Oracle/**'
      - 'Bq.Extensions.CastleWindsor/**'
      - 'Bq.Reference.Windsor/**'
      - 'Bq.Reference.Net10/**'
      - 'Bq.Messaging.Tests.TUnit/**'
      - 'Bq.Persistence.Oracle.Ef6Check/**'
      - 'scripts/test-rabbitmq.sh'
      - 'scripts/test-rabbit-sim.sh'
      - '.github/workflows/messaging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Mono and SQLite provider
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-devel libmono-sqlite4.0-cil
      # 0.2.0 adds the clock endpoint, an ack redelivery fix and --rabbitmq 4, which the tests use.
      - name: Install rabbit-sim
        run: |
          python -m pip install --only-binary=:all: rabbit-sim==0.2.0
      - name: Run messaging integration tests
        run: bash scripts/test-rabbit-sim.sh

  rabbitmq:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        broker: ['3.13-management', '4-management']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Install Mono, SQLite provider, and Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-devel libmono-sqlite4.0-cil podman
      - name: Run messaging integration tests
        env:
          BQ_RABBITMQ_IMAGE: docker.io/library/rabbitmq:${{ matrix.broker }}
        run: ./scripts/test-rabbitmq.sh
