name: Messaging integration

on:
  push:
    branches: [master]
    paths:
      - 'Bq.Messaging/**'
      - 'Bq.Messaging.Tests/**'
      - 'Bq.Persistence.Sqlite/**'
      - 'Bq.Reference.Windsor/**'
      - 'scripts/test-rabbitmq.sh'
      - '.github/workflows/messaging.yml'
  pull_request:
    paths:
      - 'Bq.Messaging/**'
      - 'Bq.Messaging.Tests/**'
      - 'Bq.Persistence.Sqlite/**'
      - 'Bq.Reference.Windsor/**'
      - 'scripts/test-rabbitmq.sh'
      - '.github/workflows/messaging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Install Mono, SQLite provider, and Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-devel libmono-sqlite4.0-cil podman
      - name: Run messaging integration tests
        run: ./scripts/test-rabbitmq.sh
