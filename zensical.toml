[project]
site_name = "The Bq book"
site_description = "Build and operate transactional .NET messaging endpoints with Bq."
site_url = "https://vivainio.github.io/bq/"
docs_dir = "docs"
repo_url = "https://github.com/vivainio/bq"
repo_name = "vivainio/bq"
edit_uri = "edit/master/docs/"

nav = [
  { "Introduction" = "index.md" },
  { "An order workflow with Bq" = "order-workflow.md" },
  { "Getting started" = "getting-started.md" },
  { "Messaging" = [
    { "Endpoints and sessions" = "endpoints.md" },
    { "Delivery architecture" = "architecture.md" },
    { "Persistence and outbox" = "persistence.md" },
    { "Database schema" = "schema.md" },
    { "Sagas and timeouts" = "sagas.md" },
    { "Retries and replay" = "recoverability.md" },
    { "Troubleshooting" = "troubleshooting.md" },
  ] },
  { "Examples and development" = [
    { "Castle Windsor example" = "windsor.md" },
    { "Moving one flow at a time" = "gradual-migration.md" },
    { "Databases in a migration" = "databases-in-migration.md" },
    { "Phased NServiceBus migration" = "migration.md" },
    { "What Bq leaves out" = "omissions.md" },
    { "Integration tests" = "testing.md" },
    { "Building this book" = "documentation.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.theme.icon]
logo = "lucide/notebook-tabs"

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "deep-orange"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "deep-orange"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/vivainio"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
check_paths = true
restrict_base_path = true
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
